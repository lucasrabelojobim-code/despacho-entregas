# Monta o APK do app do motorista (ArcosRotas Motorista) e deixa para baixar em Releases.
# Roda sozinho quando algo em android-app/ muda, ou pelo botão "Run workflow" na aba Actions.
name: APK do motorista

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/apk-motorista.yml'
      - 'marca/mot-512.png'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar peças do app
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícone e número da versão
        run: |
          res=android/app/src/main/res
          rm -rf $res/mipmap-anydpi-v26
          for d in $res/mipmap-*; do
            cp ../marca/mot-512.png $d/ic_launcher.png
            cp ../marca/mot-512.png $d/ic_launcher_round.png
          done
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ArcosRotas-Motorista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArcosRotas-Motorista
          path: android-app/ArcosRotas-Motorista.apk

      - name: Publicar para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-motorista
          name: ArcosRotas Motorista (APK)
          body: |
            App Android do motorista. Versão de teste 1.${{ github.run_number }}.
            Baixe o arquivo ArcosRotas-Motorista.apk no celular e toque nele para instalar.
          files: android-app/ArcosRotas-Motorista.apk
          make_latest: true
