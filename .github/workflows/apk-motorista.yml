# Monta os APKs do ArcosRotas (Motorista e Admin) e deixa para baixar em Releases.
# Os links de download no site apontam para releases/latest/download/<arquivo>.apk.
# Roda sozinho quando algo em android-app/ muda, ou pelo botão "Run workflow" na aba Actions.
name: APKs do ArcosRotas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/apk-motorista.yml'
      - 'marca/mot-512.png'
      - 'marca/admin-512.png'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # um de cada vez, para os dois entrarem na mesma página de download
      matrix:
        include:
          - app: motorista
            arquivo: ArcosRotas-Motorista.apk
            pagina: colaborador.html
            nome: ArcosRotas Motorista
            id: com.arcosjobim.arcosrotas.motorista
            icone: mot-512.png
          - app: admin
            arquivo: ArcosRotas-Admin.apk
            pagina: admin.html
            nome: ArcosRotas Admin
            id: com.arcosjobim.arcosrotas.admin
            icone: admin-512.png
    defaults:
      run:
        working-directory: android-app
    steps:
      # o Android SDK já vem instalado na máquina do GitHub (ubuntu-latest)
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ajustar para o app ${{ matrix.app }}
        run: |
          sed -i 's|com.arcosjobim.arcosrotas.motorista|${{ matrix.id }}|; s|ArcosRotas Motorista|${{ matrix.nome }}|; s|colaborador.html|${{ matrix.pagina }}|' capacitor.config.json
          sed -i 's|colaborador.html|${{ matrix.pagina }}|; s|ArcosRotas Motorista|${{ matrix.nome }}|' www/index.html
          # o admin não usa GPS em segundo plano: tira o plugin para o app não pedir localização
          if [ "${{ matrix.app }}" = "admin" ]; then
            node -e "const f='package.json',p=require('./'+f);delete p.dependencies['@capacitor-community/background-geolocation'];require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          fi
          cat capacitor.config.json

      - name: Instalar peças do app
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícone e número da versão
        run: |
          res=android/app/src/main/res
          rm -rf $res/mipmap-anydpi-v26
          for d in $res/mipmap-*; do
            cp ../marca/${{ matrix.icone }} $d/ic_launcher.png
            cp ../marca/${{ matrix.icone }} $d/ic_launcher_round.png
          done
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../${{ matrix.arquivo }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: android-app/${{ matrix.arquivo }}

      - name: Publicar para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-android
          name: ArcosRotas para Android (APK)
          body: |
            Apps Android do ArcosRotas. Versão de teste 1.${{ github.run_number }}.
            ArcosRotas-Motorista.apk: app do motorista, com GPS em segundo plano.
            ArcosRotas-Admin.apk: app da administração.
            Baixe o arquivo no celular e toque nele para instalar.
          files: android-app/${{ matrix.arquivo }}
          make_latest: true
