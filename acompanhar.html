<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1B27">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Acompanhe sua entrega · ArcosRotas</title>
<link rel="icon" type="image/png" href="marca/favicon.png">
<link rel="stylesheet" href="css/leaflet.css?v=20261023a">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0C1B27;color:#E6EEF5}
main{max-width:560px;margin:0 auto;padding:16px 16px 32px}
.logo{height:44px;display:block;margin:4px 0 14px}
h1{margin:0 0 2px;font-size:24px}
.sub{color:#9FB3C4;margin:0 0 14px}
.card{background:#132634;border:1px solid #23394B;border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;line-height:1.1}
.ok{color:#34D399}.warn{color:#F5B14C}.bad{color:#F47C7C}
.steps{display:flex;gap:6px;margin-top:12px}
.step{flex:1;text-align:center;font-size:12px;color:#7F95A6}
.step i{display:block;height:6px;border-radius:3px;background:#23394B;margin-bottom:6px}
.step.on{color:#E6EEF5}.step.on i{background:#3B8EEA}
.step.fim.on i{background:#34D399}
#mapa{height:300px;border-radius:12px;border:1px solid #23394B;overflow:hidden}
.note{color:#9FB3C4;font-size:13px}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mk.m{background:#0B6BB8}.mk.d{background:#34D399;color:#073}
footer{text-align:center;color:#7F95A6;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
<img class="logo" src="marca/logo.svg" alt="Arcos Jobim">
<div id="conteudo"><div id="topo"><div class="card">Carregando…</div></div><div id="mapaBox"></div></div>
<footer>ArcosRotas · Desenvolvido por <b>Arcos Jobim</b> · Automação &amp; Software</footer>
</main>
<script src="js/vendor/leaflet.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20261023a"></script>
<script src="js/acompanhar.js?v=20261023a"></script>
</body>
</html>
